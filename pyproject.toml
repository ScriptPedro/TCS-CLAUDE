[project]
name = "assessor-investimentos"
version = "1.0.0"
description = "Assessor de Investimentos Virtual — projeto acadêmico de IA Aplicada (BFSI)"
requires-python = ">=3.11,<3.13"  # 3.12 recomendado; 3.13 não instala numpy 1.26 / numba 0.60 (D21)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    # Avisos internos de bibliotecas de terceiros (matplotlib/pyparsing, shap), não do nosso código
    "ignore::DeprecationWarning",
    "ignore:LightGBM binary classifier with TreeExplainer:UserWarning",
]
